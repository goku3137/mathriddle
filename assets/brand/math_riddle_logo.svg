<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Matte Charcoal Canvas -->
  <rect width="512" height="512" rx="96" fill="#121418"/>
  
  <!-- Subtle Soft Ambient Radial Backlight -->
  <circle cx="256" cy="256" r="190" fill="#E5A93C" opacity="0.08"/>

  <!-- Subtle Minimalist Accent Brackets (Top-Left & Bottom-Right) -->
  <path d="M120 180H100V160" stroke="#E5A93C" stroke-width="3" stroke-linecap="round"/>
  <path d="M392 332H412V352" stroke="#E5A93C" stroke-width="3" stroke-linecap="round"/>

  <!-- Pure Typographic Wordmark: MATH -->
  <text x="256" y="235" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="76" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#FFFFFF">MATH</text>

  <!-- Accent Divider Line -->
  <line x1="140" y1="260" x2="372" y2="260" stroke="#E5A93C" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Pure Typographic Wordmark: RIDDLE -->
  <text x="256" y="318" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="18" 
        fill="#E5A93C">RIDDLE</text>

  <!-- Understated Minimalist Subtext -->
  <text x="256" y="360" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="12" 
        font-weight="500" 
        letter-spacing="6" 
        fill="#7A8194">LOGIC &amp; PUZZLES</text>
</svg>

